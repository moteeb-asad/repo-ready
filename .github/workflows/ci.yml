name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# CI only reads the code. Without this, the token's access depends on the repo settings.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Fails on high or critical vulnerabilities in the packages users install.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
